<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Analista de Sistemas — GSP</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<style>
  :root {
    --bg: #191919;
    --bg-sidebar: #202020;
    --bg-card: #252525;
    --border: #373737;
    --text: #e6e6e6;
    --text-dim: #9b9b9b;
    --accent: #5b8def;
    --danger: #e05252;
    --radius: 8px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    height: 100vh;
    overflow: hidden;
  }

  /* ---------- Tela de login ---------- */
  #login-screen {
    position: fixed; inset: 0; background: var(--bg);
    display: flex; align-items: center; justify-content: center; z-index: 50;
  }
  #login-screen .box {
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 32px; width: 360px;
  }
  #login-screen h2 { margin-top: 0; }
  #login-screen label { display: block; font-size: 13px; color: var(--text-dim); margin: 14px 0 4px; }
  #login-screen input {
    width: 100%; padding: 10px; border-radius: 6px; border: 1px solid var(--border);
    background: #1b1b1b; color: var(--text); font-size: 14px;
  }
  #login-screen button {
    margin-top: 20px; width: 100%; padding: 10px; border: none; border-radius: 6px;
    background: var(--accent); color: white; font-size: 14px; cursor: pointer;
  }
  #login-error { color: var(--danger); font-size: 13px; margin-top: 10px; min-height: 16px; }

  /* ---------- Layout principal ---------- */
  #sidebar {
    width: 280px; background: var(--bg-sidebar); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; flex-shrink: 0;
  }
  #sidebar-header { padding: 16px; font-weight: 600; border-bottom: 1px solid var(--border); }
  #page-list { flex: 1; overflow-y: auto; padding: 8px; }
  .page-item {
    display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 6px;
    cursor: pointer; font-size: 14px; color: var(--text); user-select: none;
  }
  .page-item:hover { background: #2c2c2c; }
  .page-item.active { background: #30353f; }
  #add-page-btn {
    margin: 8px; padding: 8px; border: 1px dashed var(--border); border-radius: 6px;
    background: none; color: var(--text-dim); cursor: pointer; font-size: 13px;
  }
  #sidebar-footer { padding: 10px 16px; border-top: 1px solid var(--border); font-size: 12px; color: var(--text-dim); }
  #sidebar-footer button { background: none; border: none; color: var(--text-dim); cursor: pointer; font-size: 12px; text-decoration: underline; padding: 0; }

  /* ---------- Área de conteúdo ---------- */
  #main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  #toolbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 24px; border-bottom: 1px solid var(--border);
  }
  #toolbar .status { font-size: 12px; color: var(--text-dim); }
  #toolbar button {
    padding: 7px 14px; border-radius: 6px; border: 1px solid var(--border);
    background: var(--bg-card); color: var(--text); cursor: pointer; font-size: 13px; margin-left: 8px;
  }
  #toolbar button.primary { background: var(--accent); border-color: var(--accent); color: white; }
  #content-wrap { flex: 1; overflow-y: auto; padding: 32px 48px; }
  #content-render { max-width: 820px; line-height: 1.6; }
  #content-render h1 { font-size: 28px; }
  #content-render h2 { font-size: 21px; margin-top: 32px; border-bottom: 1px solid var(--border); padding-bottom: 6px; }
  #content-render table { border-collapse: collapse; width: 100%; margin: 12px 0; font-size: 14px; }
  #content-render th, #content-render td { border: 1px solid var(--border); padding: 8px 10px; text-align: left; }
  #content-render th { background: var(--bg-card); }
  #content-render code { background: #2a2a2a; padding: 2px 5px; border-radius: 4px; font-size: 13px; }
  #content-render pre { background: #161616; border: 1px solid var(--border); border-radius: 6px; padding: 14px; overflow-x: auto; }
  #content-render pre code { background: none; padding: 0; }
  #content-render blockquote { border-left: 3px solid var(--accent); margin: 0; padding: 4px 14px; color: var(--text-dim); }
  #content-render li.task-list-item { list-style: none; margin-left: -20px; }
  #content-render li.task-list-item input[type=checkbox] { margin-right: 8px; cursor: pointer; transform: scale(1.1); }
  #content-render a { color: var(--accent); }

  #content-edit {
    width: 100%; max-width: 820px; height: calc(100vh - 160px);
    background: #161616; color: var(--text); border: 1px solid var(--border); border-radius: 6px;
    padding: 16px; font-family: "SFMono-Regular", Consolas, Menlo, monospace; font-size: 13.5px;
    line-height: 1.6; resize: none;
  }
  .hidden { display: none !important; }
</style>
</head>
<body>

<div id="login-screen">
  <div class="box">
    <h2>🖥️ Analista de Sistemas — GSP</h2>
    <p style="color:var(--text-dim); font-size:13px;">Configure a conexão uma vez. Fica salvo só neste navegador.</p>
    <label>URL do Worker (Cloudflare)</label>
    <input id="input-url" placeholder="https://gsp-notebook-api.seunome.workers.dev" />
    <label>Token de acesso</label>
    <input id="input-token" type="password" placeholder="sua senha/token" />
    <button onclick="doLogin()">Entrar</button>
    <div id="login-error"></div>
  </div>
</div>

<div id="sidebar" class="hidden">
  <div id="sidebar-header">🖥️ Analista de Sistemas — GSP</div>
  <div id="page-list"></div>
  <button id="add-page-btn" onclick="addPage()">+ Nova página</button>
  <div id="sidebar-footer">
    <button onclick="logout()">Sair / trocar conexão</button>
  </div>
</div>

<div id="main" class="hidden">
  <div id="toolbar">
    <div>
      <strong id="page-title"></strong>
      <div class="status" id="page-status"></div>
    </div>
    <div>
      <button id="btn-edit" onclick="toggleEdit()">Editar</button>
      <button id="btn-save" class="primary hidden" onclick="savePage()">Salvar</button>
      <button id="btn-delete" onclick="deletePage()" style="color:var(--danger);">Excluir</button>
    </div>
  </div>
  <div id="content-wrap">
    <div id="content-render"></div>
    <textarea id="content-edit" class="hidden"></textarea>
  </div>
</div>

<script>
marked.setOptions({ gfm: true, breaks: false });

let API_URL = localStorage.getItem("gsp_api_url") || "";
let TOKEN = localStorage.getItem("gsp_token") || "";
let pages = [];
let currentSlug = null;
let editing = false;

function doLogin() {
  const url = document.getElementById("input-url").value.trim().replace(/\/$/, "");
  const token = document.getElementById("input-token").value.trim();
  if (!url || !token) {
    document.getElementById("login-error").textContent = "Preencha os dois campos.";
    return;
  }
  API_URL = url;
  TOKEN = token;
  testConnection(true);
}

function logout() {
  localStorage.removeItem("gsp_api_url");
  localStorage.removeItem("gsp_token");
  location.reload();
}

async function api(path, options = {}) {
  const res = await fetch(API_URL + path, {
    ...options,
    headers: {
      "Content-Type": "application/json",
      Authorization: "Bearer " + TOKEN,
      ...(options.headers || {}),
    },
  });
  if (res.status === 401) throw new Error("Token inválido ou expirado.");
  if (!res.ok) throw new Error("Erro " + res.status + ": " + (await res.text()));
  return res.status === 204 ? null : res.json();
}

async function testConnection(saveOnSuccess) {
  try {
    const list = await api("/api/pages");
    if (saveOnSuccess) {
      localStorage.setItem("gsp_api_url", API_URL);
      localStorage.setItem("gsp_token", TOKEN);
    }
    document.getElementById("login-screen").classList.add("hidden");
    document.getElementById("sidebar").classList.remove("hidden");
    document.getElementById("main").classList.remove("hidden");
    pages = list;
    renderSidebar();
    if (pages.length) loadPage(pages[0].slug);
  } catch (e) {
    document.getElementById("login-error").textContent = "Não consegui conectar: " + e.message;
  }
}

function renderSidebar() {
  const list = document.getElementById("page-list");
  list.innerHTML = "";
  pages.forEach((p) => {
    const div = document.createElement("div");
    div.className = "page-item" + (p.slug === currentSlug ? " active" : "");
    div.textContent = (p.icon || "📄") + "  " + p.title;
    div.onclick = () => loadPage(p.slug);
    list.appendChild(div);
  });
}

let currentPage = null;

async function loadPage(slug) {
  currentSlug = slug;
  editing = false;
  setEditUI();
  renderSidebar();
  document.getElementById("page-status").textContent = "Carregando...";
  currentPage = await api("/api/pages/" + slug);
  document.getElementById("page-title").textContent = (currentPage.icon || "📄") + " " + currentPage.title;
  document.getElementById("page-status").textContent = "Atualizado em " + currentPage.updated_at;
  renderContent();
}

function renderContent() {
  const html = marked.parse(currentPage.content || "");
  const box = document.getElementById("content-render");
  box.innerHTML = html;
  // torna checkboxes de checklist clicáveis
  const checkboxes = box.querySelectorAll('li input[type="checkbox"]');
  checkboxes.forEach((cb, idx) => {
    cb.disabled = false;
    cb.addEventListener("change", () => toggleChecklistItem(idx));
  });
}

// Alterna o n-ésimo "- [ ]" / "- [x]" do markdown bruto e salva.
function toggleChecklistItem(idx) {
  const lines = currentPage.content.split("\n");
  let count = -1;
  for (let i = 0; i < lines.length; i++) {
    const m = lines[i].match(/^(\s*-\s*)\[( |x|X)\]/);
    if (m) {
      count++;
      if (count === idx) {
        const checked = m[2].toLowerCase() === "x";
        lines[i] = lines[i].replace(/\[( |x|X)\]/, checked ? "[ ]" : "[x]");
        break;
      }
    }
  }
  currentPage.content = lines.join("\n");
  savePage(true);
}

function toggleEdit() {
  editing = !editing;
  if (editing) document.getElementById("content-edit").value = currentPage.content || "";
  setEditUI();
  if (!editing) renderContent();
}

function setEditUI() {
  document.getElementById("content-render").classList.toggle("hidden", editing);
  document.getElementById("content-edit").classList.toggle("hidden", !editing);
  document.getElementById("btn-edit").textContent = editing ? "Cancelar" : "Editar";
  document.getElementById("btn-save").classList.toggle("hidden", !editing);
}

async function savePage(silent) {
  if (editing) currentPage.content = document.getElementById("content-edit").value;
  document.getElementById("page-status").textContent = "Salvando...";
  await api("/api/pages/" + currentSlug, {
    method: "PUT",
    body: JSON.stringify(currentPage),
  });
  document.getElementById("page-status").textContent = "Salvo agora mesmo.";
  if (!silent) {
    editing = false;
    setEditUI();
    renderContent();
  }
  const idx = pages.findIndex((p) => p.slug === currentSlug);
  if (idx >= 0) { pages[idx].title = currentPage.title; pages[idx].icon = currentPage.icon; }
  renderSidebar();
}

async function addPage() {
  const title = prompt("Título da nova página:");
  if (!title) return;
  const slug = title.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "")
    .replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "") || ("pagina-" + Date.now());
  const icon = prompt("Emoji do ícone (opcional):", "📄") || "📄";
  await api("/api/pages/" + slug, {
    method: "PUT",
    body: JSON.stringify({ title, icon, order_idx: pages.length, content: "# " + title + "\n\n" }),
  });
  const list = await api("/api/pages");
  pages = list;
  renderSidebar();
  loadPage(slug);
}

async function deletePage() {
  if (!currentSlug) return;
  if (!confirm("Excluir a página \"" + currentPage.title + "\"? Isso não tem volta.")) return;
  await api("/api/pages/" + currentSlug, { method: "DELETE" });
  const list = await api("/api/pages");
  pages = list;
  currentSlug = null;
  document.getElementById("content-render").innerHTML = "";
  document.getElementById("page-title").textContent = "";
  document.getElementById("page-status").textContent = "";
  renderSidebar();
  if (pages.length) loadPage(pages[0].slug);
}

// auto-login se já tiver conexão salva
if (API_URL && TOKEN) testConnection(false);
</script>
</body>
</html>
